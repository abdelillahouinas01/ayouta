<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JUI - Love & Light</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google Fonts: Poppins & Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- خلفية الجسيمات التفاعلية -->
  <canvas id="particlesCanvas"></canvas>

  <!-- الحاوية الرئيسية -->
  <main class="card-container">
    <div class="glass-card">
      
      <!-- اسم الواجهة العلوي -->
      <header class="header">
        <h1 class="glow-title" data-text="JUI">JUI</h1>
        <div class="subtitle">A Journey of Pure Emotion</div>
      </header>

      <!-- قسم الاعترافات والجمل المتبدلة -->
      <section class="quote-wrapper">
        <div class="quote-box">
          <p id="confessionText" class="quote-text"></p>
        </div>
      </section>

      <!-- مؤشر التقدم والتفاعل -->
      <footer class="footer">
        <div class="dots-indicator" id="dotsContainer"></div>
        <button id="interactiveBtn" class="pulse-btn">
          <span>💖 Tap for Magic</span>
        </button>
      </footer>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
